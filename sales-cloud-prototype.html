<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Cloud – Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Roboto+Flex:wght@300..800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#f3f3f3;--card:#fff;--tx:#1c2b3a;--mut:#5c6b7a;--bd:#dddbda;--hov:#f3f6fa;--pr:#0176d3;--ok:#2e844a;--warn:#c25b00;--err:#ba0517;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--card:#1d2026;--tx:#e6e9ee;--mut:#98a2b0;--bd:#2f343c;--hov:#262b33;--pr:#4aa3f0;--ok:#4cc275;--warn:#f0a050;--err:#ff7a80;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:'Roboto Flex',system-ui,sans-serif;font-size:13px}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle;font-weight:normal;font-style:normal}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:4px;padding:6px 12px;font-weight:600;color:var(--pr);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--hov)}.btn-p{background:var(--pr);color:#fff;border-color:var(--pr)}.btn-p:hover{background:var(--pr);filter:brightness(1.1)}
.inp{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:4px;padding:6px 8px}
.inp:focus,.btn:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.chip{border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}
.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.wr{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.mut{color:var(--mut)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-size:11px;padding:8px 12px;border-bottom:1px solid var(--bd)}td{padding:9px 12px;border-bottom:1px solid var(--bd)}tr.r{cursor:pointer}tr.r:hover{background:var(--hov)}
.kc{cursor:grab;border-left:3px solid var(--pr)}.kc:active{cursor:grabbing}.kcol.over{outline:2px dashed var(--pr)}
.step{flex:1;text-align:center;padding:8px 4px;font-weight:600;cursor:pointer;background:var(--hov);color:var(--mut);clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,8% 50%);min-width:90px}
.step.done{background:var(--ok);color:#fff}.step.cur{background:var(--pr);color:#fff}
@media print{body>*:not(#modal){display:none!important}}
</style></head>
<body>
<header class="sticky z-30 card" style="top:env(safe-area-inset-top,0px);border-radius:0;border-width:0 0 1px">
 <div class="flex items-center gap-3 px-3 py-2">
  <span class="ms" style="color:var(--pr);font-size:30px">cloud</span><b class="text-base hidden sm:block">Sales Cloud</b>
  <div class="relative flex-1 max-w-xl"><span class="ms mut absolute left-2 top-1.5">search</span><input id="gs" class="inp" style="padding-left:32px" placeholder="Search opportunities and accounts, then press Enter" onkeydown="if(event.key==='Enter'){S.q=this.value;nav('opps')}"></div>
  <button class="btn btn-p" onclick="modal('opp')"><span class="ms">add</span>New</button>
  <span class="ms mut" title="3 notifications" onclick="toast('You have 3 deals closing this week')" style="cursor:pointer">notifications</span>
  <span class="w-8 h-8 rounded-full grid place-items-center text-white font-bold" style="background:var(--pr)" title="Alex Lee">AL</span>
 </div>
 <nav id="nav" class="flex gap-1 px-3 overflow-x-auto"></nav>
</header>
<main id="app" class="p-3 md:p-4 max-w-[1500px] mx-auto"></main>
<div id="modal"></div><div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 z-50"></div>
<script>
const KEY='sc-proto-v2',$=s=>document.querySelector(s);
const D=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const fd=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const M=n=>'$'+Math.round(n).toLocaleString('en-US');
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['Prospecting','Qualification','Needs Analysis','Proposal','Negotiation','Closed Won'],PR=[10,20,40,75,90,100];
const OWN={AL:'Alex Lee',SC:'Sara Chen',DM:'Dan Mills',RV:'Ravi Verma',TS:'Tony Stark'};
const CAT=[['Security Platform Enterprise','SEC-800',800],['24/7 Platinum Global Support','SVC-902',120000],['Zero Trust Threat Intelligence Hub','SEC-880',250000],['Hardware Security Appliance Node','HW-410',45000],['Data Cloud Connector','DC-210',65000],['Analytics Suite License','AN-300',160000]];
const ago=t=>{const h=(Date.now()-t)/36e5;return h<1?'Just now':h<24?Math.round(h)+' hours ago':Math.round(h/24)+' days ago'};
const days=s=>Math.round((new Date(s+'T00:00')-new Date(D(0)+'T00:00'))/864e5);
const clone=x=>JSON.parse(JSON.stringify(x));
function seed(){
 const R=[['Acme Corp - 500 Enterprise Licenses','Acme Corporation',120000,0,16,'AL',''],['Pinnacle Financial - Data Cloud','Pinnacle Financial Ltd',65000,0,29,'SC','Schedule discovery call'],['Globex - Global Cloud Migration','Globex International',280000,1,33,'DM',''],['Wayne Ent - Hardware Renewal','Wayne Enterprises',140000,1,41,'AL','Technical scope review'],['Initech - Analytics Suite','Initech Software',160000,2,21,'RV','Deliver architecture blueprint'],['Hooli - Enterprise Support Add-on','Hooli Corporation',150000,2,46,'SC',''],['Stark Ind - Q3 Security Platform','Stark Industries',520000,3,2,'TS','Send revised MSA & discount auth'],['Cyberdyne - AI Inference Cluster','Cyberdyne Systems',375000,3,9,'AL',''],['Umbrella Corp - Global Multi-tenant','Umbrella Pharmaceuticals',450000,4,1,'SC','Legal sign-off on redlines'],['Massive Dynamic - Platform SLA','Massive Dynamic LLC',190000,4,6,'DM',''],['Soylent Corp - 3-Year Enterprise Agreement','Soylent Corporation',750000,5,-12,'SC',''],['Tyrell Corp - Bio-Cloud Integration','Tyrell Corporation',500000,5,-8,'AL','']];
 const opps=R.map((r,i)=>({id:i+1,name:r[0],account:r[1],amount:r[2],stage:r[3],close:D(r[4]),owner:r[5],next:r[6],items:[{n:'Platform licence',c:'GEN-100',p:r[2],q:1,d:0}]}));
 opps[6].items=[{n:'24/7 Platinum Global Support',c:'SVC-902',p:120000,q:1,d:0},{n:'Zero Trust Threat Intelligence Hub',c:'SEC-880',p:250000,q:1,d:5},{n:'Hardware Security Appliance Node',c:'HW-410',p:45000,q:4,d:10}];
 const h=36e5,now=Date.now();
 return{opps,cur:7,view:'kanban',quotes:[],
 contacts:[['Pepper Potts','Chief Operating Officer','Stark Industries','ppotts@starkindustries.com'],['James Rhodes','Liaison Officer','Stark Industries','jrhodes@af.mil'],['Bruce Wayne','CEO','Wayne Enterprises','bruce@wayne-ent.com'],['Hank Scorpio','VP Procurement','Globex International','hank@globex.com'],['Peter Gibbons','Director of IT','Initech Software','peter@initech.com'],['Gavin Belson','Head of Platform','Hooli Corporation','gavin@hooli.com'],['Albert Wesker','CTO','Umbrella Pharmaceuticals','awesker@umbrella.com'],['Nellie Bertram','Procurement Lead','Acme Corporation','nellie@acme.com']],
 leads:[['Maya Patel','Northwind Traders','Webinar','New'],['Jordan Reyes','Vandelay Industries','Partner Referral','Working'],['Priya Nair','Wonka Labs','Trade Show','New'],['Chris Okafor','Oscorp','Inbound Web','Working'],['Elena Rossi','Gringotts Capital','Outbound','New']],
 tasks:[{t:'Follow up on revised SLA contract',due:'Today',opp:7},{t:'Send MSA redlines to legal',due:'Tomorrow',opp:9},{t:'Prep demo for Cyberdyne',due:'In 3 days',opp:8},{t:'Schedule discovery call with Pinnacle',due:'In 4 days',opp:2}],
 acts:{7:[{k:'mail',x:'Email sent: Stark Industries - Q3 Platform Proposal v2.pdf',t:now-26*h},{k:'call',x:'Discovery call with VP of Infrastructure (42 min). Budget authority confirmed.',t:now-75*h},{k:'sync',x:'Stage changed to Proposal',t:now-120*h}]}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||seed();
const cur=()=>S.opps.find(o=>o.id==S.cur),prob=o=>o.lost?0:PR[o.stage];
function toast(m){const t=$('#toast');t.innerHTML=`<div class="card px-4 py-2 shadow-lg font-semibold" style="background:var(--tx);color:var(--bg)">${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2600)}
function nav(v,id){if(id)S.cur=id;save();if(location.hash==='#'+v)render();else location.hash=v}
const chipC=o=>o.stage==5?'ok':days(o.close)<=3?'wr':'';
function table(h,rows){return`<div class="card overflow-x-auto"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="9" class="mut">Nothing here yet. Use New to add the first record.</td></tr>`}</tbody></table></div>`}
const V={};
V.home=()=>{
 const op=S.opps.filter(o=>o.stage<5),won=S.opps.filter(o=>o.stage==5&&!o.lost).reduce((a,o)=>a+o.amount,0),pipe=op.reduce((a,o)=>a+o.amount,0),w=op.reduce((a,o)=>a+o.amount*prob(o)/100,0),Q=2000000;
 const by=ST.slice(0,5).map((s,i)=>[s,S.opps.filter(o=>o.stage==i).reduce((a,o)=>a+o.amount,0)]),mx=Math.max(...by.map(b=>b[1]),1);
 const soon=[...op].sort((a,b)=>a.close<b.close?-1:1).slice(0,5);
 const hr=new Date().getHours(),g=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
 const kp=(l,v,s)=>`<div class="card p-4"><div class="mut font-semibold">${l}</div><div class="text-2xl font-bold mt-1">${v}</div><div class="mut mt-1">${s}</div></div>`;
 const hot=S.opps.find(o=>o.id==7&&o.stage<5);
 return`<div class="mb-4"><h1 class="text-2xl font-bold">${g}, Alex</h1><p class="mut">You have ${op.filter(o=>days(o.close)<=7).length} deals closing within a week and ${S.tasks.length} open tasks.</p></div>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-3">${kp('Open pipeline',M(pipe),op.length+' active deals')}${kp('Weighted forecast',M(w),'Based on stage probability')}${kp('Closed won this quarter',M(won),Math.round(won/Q*100)+'% of '+M(Q)+' quota')}${kp('Win rate',Math.round(S.opps.filter(o=>o.stage==5).length/S.opps.length*100)+'%','Across '+S.opps.length+' opportunities')}</div>
 <div class="grid lg:grid-cols-3 gap-3">
 <div class="card p-4 lg:col-span-2"><b>Pipeline by stage</b><div class="mt-3 space-y-2">${by.map(([s,v],i)=>`<div class="flex items-center gap-3 cursor-pointer" onclick="S.view='kanban';nav('opps')"><span class="w-32 shrink-0">${s}</span><div class="flex-1 h-6 rounded" style="background:var(--hov)"><div class="h-6 rounded" style="width:${v/mx*100}%;background:var(--pr);opacity:${.45+i*.12}"></div></div><b class="w-24 text-right">${M(v)}</b></div>`).join('')}</div>
 <div class="mt-4"><div class="flex justify-between mb-1"><b>Quota attainment</b><span>${M(won)} of ${M(Q)}</span></div><div class="h-3 rounded" style="background:var(--hov)"><div class="h-3 rounded" style="width:${Math.min(100,won/Q*100)}%;background:var(--ok)"></div></div></div></div>
 <div class="card p-4"><b class="flex items-center gap-1"><span class="ms" style="color:var(--pr)">auto_awesome</span>Einstein suggests</b>
  ${hot?`<p class="mt-2">${E(hot.account)} is standardising procurement for next quarter. Offer a Platinum Support voucher if they sign before ${fd(hot.close)}.</p><button class="btn btn-p mt-3" onclick="nav('opp-detail',7)">Review deal</button>`:'<p class="mt-2 mut">No urgent recommendations right now.</p>'}</div>
 <div class="card lg:col-span-2"><div class="p-4 pb-2"><b>Closing soon</b></div>${table(['Deal','Account','Amount','Close date'],soon.map(o=>`<tr class="r" onclick="nav('opp-detail',${o.id})"><td><b>${E(o.name)}</b></td><td>${E(o.account)}</td><td>${M(o.amount)}</td><td><span class="chip ${chipC(o)}">${days(o.close)<0?'Overdue':days(o.close)==0?'Today':'In '+days(o.close)+' days'}</span></td></tr>`).join(''))}</div>
 <div class="card p-4"><b>My tasks</b><div class="mt-2">${S.tasks.map((t,i)=>`<label class="flex gap-2 py-2 border-b" style="border-color:var(--bd)"><input type="checkbox" onchange="S.tasks.splice(${i},1);save();toast('Task completed');render()"><span class="flex-1">${E(t.t)}<br><small class="mut">${t.due}</small></span></label>`).join('')||'<p class="mut mt-2">All caught up. Nice work.</p>'}</div></div></div>`}
V.opps=()=>{
 const q=(S.q||'').toLowerCase(),L=S.opps.filter(o=>(!S.mine||o.owner=='AL')&&(o.name+o.account).toLowerCase().includes(q)),tot=L.reduce((a,o)=>a+o.amount,0);
 const bar=`<div class="flex flex-wrap items-center gap-2 mb-3"><div><div class="mut">Opportunities</div><h1 class="text-xl font-bold">${S.mine?'My opportunities':'All opportunities'}</h1></div><span class="mut ml-2">${L.length} items · Total ${M(tot)}</span><span class="flex-1"></span>
 <input class="inp" style="width:200px" placeholder="Filter this list" value="${E(S.q||'')}" oninput="S.q=this.value;clearTimeout(window.ft);window.ft=setTimeout(()=>{render();const i=document.querySelector('[placeholder=\\'Filter this list\\']');i.focus();i.setSelectionRange(99,99)},250)">
 <button class="btn" onclick="S.mine=!S.mine;render()">${S.mine?'Show everyone':'Only mine'}</button>
 <button class="btn" onclick="S.view='${S.view=='kanban'?'list':'kanban'}';render()"><span class="ms">${S.view=='kanban'?'table_rows':'view_kanban'}</span>${S.view=='kanban'?'List':'Board'}</button><button class="btn btn-p" onclick="modal('opp')"><span class="ms">add</span>New</button></div>`;
 if(S.view=='list')return bar+table(['Name','Account','Stage','Amount','Close date','Owner'],L.map(o=>`<tr class="r" onclick="nav('opp-detail',${o.id})"><td><b>${E(o.name)}</b></td><td>${E(o.account)}</td><td>${ST[o.stage]}</td><td>${M(o.amount)}</td><td>${fd(o.close)}</td><td>${OWN[o.owner]}</td></tr>`).join(''));
 return bar+`<p class="mut mb-2 flex items-center gap-1"><span class="ms">info</span>Drag a deal to another stage to update it.</p><div class="flex gap-3 overflow-x-auto pb-3">${ST.map((s,i)=>{const c=L.filter(o=>o.stage==i&&!o.lost);return`<div class="kcol card shrink-0 w-72 p-2" style="background:var(--hov)" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,${i})"><div class="px-1 pb-2"><b>${s}</b><div class="mut">${c.length} deals · ${M(c.reduce((a,o)=>a+o.amount,0))}</div></div><div class="space-y-2">${c.map(o=>`<div class="kc card p-3" draggable="true" ondragstart="event.dataTransfer.setData('t',${o.id})" onclick="nav('opp-detail',${o.id})"><b style="color:var(--pr)">${E(o.name)}</b><div class="mut">${E(o.account)}</div><div class="flex justify-between mt-2"><b>${M(o.amount)}</b><span class="mut">${PR[i]}%</span></div>${o.next?`<div class="mut mt-1">Next: ${E(o.next)}</div>`:''}<div class="flex justify-between items-center mt-2"><span class="chip ${chipC(o)}">${fd(o.close)}</span><span class="w-6 h-6 rounded-full grid place-items-center text-white text-[10px] font-bold" style="background:var(--pr)" title="${OWN[o.owner]}">${o.owner}</span></div></div>`).join('')}</div></div>`}).join('')}</div>`}
function drop(e,i){e.preventDefault();const o=S.opps.find(x=>x.id==e.dataTransfer.getData('t'));if(!o||o.stage==i)return render();setStage(o,i)}
function setStage(o,i){o.stage=i;(S.acts[o.id]=S.acts[o.id]||[]).unshift({k:'sync',x:'Stage changed to '+ST[i],t:Date.now()});save();toast(i==5?'Deal closed won. Congratulations!':E(o.name)+' moved to '+ST[i]);render()}
const LEFT=[['owner','Opportunity owner','s'],['name','Opportunity name','t'],['source','Opportunity source','s',['Partner Referral','Inbound Web','Outbound','Trade Show','Webinar']],['account','Account name','ro'],['type','Type','s',['New Customer','Add-on','Renewal']],['channel','Revenue channel','s',['Direct','Partner','Distributor']],['refRep','Referral rep','t'],['currency','Currency','s',['USD','EUR','GBP','INR']],['hold','Hold tag','t'],['chInit','Channel initiated','b'],['so','Sales order number','t'],['bill','Auto bill status','s',['Not started','Active','Paused']],['last','Last activity','ro'],['state','Account state','t'],['competitor','Competitor','t']];
const RIGHT=[['rt','Record type','s',['Enterprise','Renewal','Expansion']],['sdr','Stage duration risk','s',['N/A','Low','Medium','High']],['amount','Amount (from products)','ro'],['orig','Original amount','n'],['close','Close date','d'],['stage','Stage','ro'],['prob','Probability','ro'],['fc','Forecast status','s',['Pipeline','Best case','Commit','Closed','Omitted']],['mfo','Manager forecast override','s',['None','Pipeline','Commit']],['next','Next step','t'],['won','Why we won','ta'],['lost','Why we lost','ta'],['risk','Risk classification','s',['None','Low','Medium','High']],['churn','Risk/churn level','s',['Level 1','Level 2','Level 3']],['notes','At-risk notes','ta'],['desc','Description','ta']];
const gv=(o,k)=>{const f=o.f||{},a=S.acts[o.id]||[],m={owner:o.owner,name:o.name,account:o.account,close:o.close,next:o.next,amount:o.amount,stage:o.lost?'Closed Lost':ST[o.stage],prob:prob(o)+'%',last:a[0]?ago(a[0].t):'None',source:'Partner Referral',type:'New Customer',channel:'Direct',currency:'USD',bill:'Not started',rt:'Enterprise',sdr:'N/A',fc:o.stage==5?'Closed':o.stage>=3?'Commit':'Pipeline',mfo:'None',risk:'None',churn:'Level 1',orig:o.amount};return k in f?f[k]:m[k]??''};
const riskOf=o=>{const r=gv(o,'risk');return r!='None'?r:o.stage==5?'None':days(o.close)<=3?'High':days(o.close)<=10&&o.stage>=3?'Medium':'Low'};
const fld=(o,[k,l,t,op])=>{const v=gv(o,k),ed=S.ed==k&&t!='ro'&&t!='b';let b;
 if(t=='b')b=`<input type="checkbox" ${v?'checked':''} onchange="sf('${k}',this.checked)">`;
 else if(ed){const a=`data-ed onchange="sf('${k}',this.value)" onblur="S.ed=null;render()"`;b=t=='s'?`<select class="inp" ${a}>${(k=='owner'?Object.keys(OWN):op).map(x=>`<option value="${x}" ${x==v?'selected':''}>${k=='owner'?OWN[x]:x}</option>`).join('')}</select>`:t=='ta'?`<textarea class="inp" rows="3" ${a}>${E(v)}</textarea>`:`<input class="inp" type="${t=='n'?'number':t=='d'?'date':'text'}" value="${E(v)}" ${a}>`}
 else b=`<div class="font-semibold break-words">${t=='n'?M(v):t=='d'?fd(v):k=='amount'?M(v):k=='owner'?OWN[v]:E(v)||'–'}</div>`;
 return`<div class="py-2 border-b flex justify-between gap-2" style="border-color:var(--bd)"><div class="min-w-0 flex-1"><div class="mut text-[11px]">${l}</div>${b}</div>${t=='ro'||t=='b'?'':`<span class="ms mut" style="font-size:16px;cursor:pointer" title="Edit" onclick="S.ed='${k}';render()">edit</span>`}</div>`};
function sf(k,v){const o=cur();if(['owner','name','close','next'].includes(k))o[k]=v;else(o.f=o.f||{})[k]=k=='orig'?+v:v;S.ed=null;save();toast('Saved');render()}
function roles(o){return o.roles=o.roles||S.contacts.filter(c=>c[2]==o.account).map((c,i)=>({name:c[0],role:i?'Technical Evaluator':'Decision Maker',primary:!i}))}
function cloneOpp(rel){const o=clone(cur());o.id=Math.max(...S.opps.map(x=>x.id))+1;o.name+=' (clone)';if(rel)S.acts[o.id]=clone(S.acts[S.cur]||[]);S.opps.push(o);S.cur=o.id;save();toast(rel?'Cloned with related records':'Opportunity cloned');nav('opp-detail')}
const tab=t=>{S.tab=t;render()};
V['opp-detail']=()=>{
 const o=cur();if(!o)return V.opps();const T=S.tab||'details',R=roles(o),P=o.partners=o.partners||[],Q=S.quotes.filter(q=>q.opp==o.id),tl=S.acts[o.id]||[],tk=S.tasks.filter(t=>t.opp==o.id),ch=(S.chat=S.chat||{})[o.id]||[],rk=riskOf(o),
 mi='w-full text-left px-3 py-2 rounded hover:bg-[var(--hov)]',hd=(l,v)=>`<div><div class="mut text-[11px]">${l}</div><b>${v}</b></div>`,sec=(t,a,b)=>`<div class="card p-4"><div class="flex justify-between items-center"><b>${t}</b>${a?`<button class="btn" onclick="${a}">${b}</button>`:''}</div>`;
 const pv={details:`<div class="card p-4"><b>Details</b><div class="grid md:grid-cols-2 gap-x-8 mt-1"><div>${LEFT.map(f=>fld(o,f)).join('')}</div><div>${RIGHT.map(f=>fld(o,f)).join('')}</div></div></div>`,

 return`<div class="card p-4 mb-3"><div class="flex flex-wrap items-start gap-2"><span class="ms" style="color:var(--warn);font-size:32px">handshake</span><div class="flex-1 min-w-[220px]"><div class="mut cursor-pointer" onclick="nav('opps')">Opportunity ›</div><h1 class="text-xl font-bold">${E(o.name)}</h1></div>
 <button class="btn" onclick="o_f()">${cur().fol?'✓ Following':'+ Follow'}</button><button class="btn" onclick="toast('Shared to #deals in Slack')">Send to Slack</button><button class="btn" onclick="window.print()">Printable view</button><button class="btn" onclick="cloneOpp(0)">Clone</button><button class="btn" onclick="modal('edit')">Edit</button><button class="btn btn-p" onclick="openQuote(${o.id})">Generate quote</button>
 <details class="relative"><summary class="btn list-none">▾</summary><div class="card absolute right-0 mt-1 w-52 z-20 p-1 shadow-lg"><button class="${mi}" onclick="cloneOpp(1)">Clone with related</button><button class="${mi}" onclick="S.tab='details';S.ed='refRep';render()">Add referral</button><button class="${mi}" onclick="S.ed='owner';S.tab='details';render()">Change owner</button><button class="${mi}" onclick="o_s()">${cur().slack?'Turn off Slack alerts':'Turn on Slack alerts'}</button><button class="${mi}" style="color:var(--err)" onclick="if(confirm('Delete this opportunity?')){S.opps=S.opps.filter(x=>x.id!=${o.id});save();toast('Opportunity deleted');nav('opps')}">Delete</button></div></details></div>
 <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mt-4">${hd('Account name',`<a class="cursor-pointer" style="color:var(--pr)" onclick="S.q='${E(o.account).replace(/'/g,'')}';nav('opps')">${E(o.account)}</a>`)}${hd('Close date',fd(o.close))}${hd('Amount',M(o.amount))}${hd('Opportunity owner',OWN[o.owner])}${hd('Risk flag',`<span class="chip ${rk=='High'?'wr':rk=='Low'||rk=='None'?'ok':''}">${rk}</span>`)}</div></div>
 <div class="card p-3 mb-3 flex items-center gap-3"><div class="flex flex-1 overflow-x-auto gap-1">${ST.map((s,i)=>`<div class="step ${i<o.stage||o.stage==5?'done':i==o.stage?'cur':''}" ${i==5&&o.lost?'style="background:var(--err)"':''} onclick="setStage(cur(),${i})">${i<o.stage||o.stage==5?'✓ ':''}${i==5&&o.lost?'Closed Lost':s}</div>`).join('')}</div>${o.stage<5?`<button class="btn btn-p" onclick="setStage(cur(),${o.stage+1})">Mark stage as complete</button>`:`<button class="btn btn-p" onclick="const x=cur();x.lost=!x.lost;save();toast('Marked '+(x.lost?'closed lost':'closed won'));render()">Change closed stage</button>`}</div>
 <div class="flex gap-4 border-b mb-3" style="border-color:var(--bd)">${[['details','Details'],['related','Related'],['activity','Activity'],['chatter','Chatter']].map(t=>`<a class="py-2 font-semibold cursor-pointer" style="${T==t[0]?'border-bottom:3px solid var(--pr);color:var(--pr)':'color:var(--mut)'}" onclick="tab('${t[0]}')">${t[1]}</a>`).join('')}</div>
 <div class="grid lg:grid-cols-3 gap-3"><div class="lg:col-span-2">${pv}</div><div class="space-y-3">
 ${sec('Quick links')}<div class="mt-2 grid gap-1">${[['Contact roles ('+R.length+')','details'],['Products ('+o.items.length+')','related'],['Quotes ('+Q.length+')','related'],['Activities ('+tl.length+')','activity']].map(l=>`<a class="cursor-pointer" style="color:var(--pr)" onclick="tab('${l[1]}')">${l[0]}</a>`).join('')}</div></div>
 ${sec('Contact roles ('+R.length+')',"modal('role')",'Add')}${R.map((r,i)=>{const c=S.contacts.find(x=>x[0]==r.name)||[];return`<div class="py-2 border-b" style="border-color:var(--bd)"><div class="flex justify-between"><b>${E(r.name)} ${r.primary?'<span class="chip">Primary</span>':`<a class="cursor-pointer mut font-normal" onclick="roles(cur()).forEach((x,j)=>x.primary=j==${i});save();render()">Make primary</a>`}</b><span class="ms mut" style="font-size:16px;cursor:pointer" title="Remove" onclick="roles(cur()).splice(${i},1);save();render()">close</span></div><div class="mut">${r.role} · ${E(c[1]||'')}<br>${E(c[3]||'')}</div></div>`}).join('')||'<p class="mut mt-2">No contact roles yet.</p>'}</div>
 ${sec('Opportunity partners ('+P.length+')',"modal('partner')",'Add')}${P.map((p,i)=>`<div class="flex justify-between py-2"><span><b>${E(p.name)}</b><br><span class="mut">${p.type}</span></span><span class="ms mut" style="font-size:16px;cursor:pointer" onclick="cur().partners.splice(${i},1);save();render()">close</span></div>`).join('')||'<p class="mut mt-2">No partners on this deal.</p>'}</div></div></div>`}
function o_f(){const o=cur();o.fol=!o.fol;save();toast(o.fol?'You are following this deal':'Unfollowed');render()}
function o_s(){const o=cur();o.slack=!o.slack;save();toast(o.slack?'Slack alerts on':'Slack alerts off');render()}
function logAct(e){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.k=='task_alt'){S.tasks.unshift({t:v.x,due:'This week',opp:S.cur});toast('Task added')}else toast('Activity logged');(S.acts[S.cur]=S.acts[S.cur]||[]).unshift({k:v.k,x:v.x,t:Date.now()});save();render()}
V.leads=()=>`<div class="flex items-center mb-3"><h1 class="text-xl font-bold flex-1">Leads</h1><button class="btn btn-p" onclick="modal('lead')"><span class="ms">add</span>New lead</button></div>`+table(['Name','Company','Source','Status',''],S.leads.map((l,i)=>`<tr><td><b>${E(l[0])}</b></td><td>${E(l[1])}</td><td>${E(l[2])}</td><td><span class="chip ${l[3]=='New'?'':'wr'}">${l[3]}</span></td><td class="text-right"><button class="btn" onclick="convert(${i})">Convert to deal</button></td></tr>`).join(''));
function convert(i){const l=S.leads.splice(i,1)[0],id=Math.max(0,...S.opps.map(o=>o.id))+1;if(!S.opps.some(o=>o.account==l[1]))S.contacts.push([l[0],'Primary contact',l[1],l[0].split(' ')[0].toLowerCase()+'@'+l[1].toLowerCase().replace(/\W/g,'')+'.com']);S.opps.push({id,name:l[1]+' - New opportunity',account:l[1],amount:50000,stage:0,close:D(45),owner:'AL',next:'Schedule discovery call',items:[{n:'Platform licence',c:'GEN-100',p:50000,q:1,d:0}]});S.cur=id;save();toast(E(l[0])+' converted to an opportunity');nav('opp-detail')}
V.accounts=()=>{const A=[...new Set(S.opps.map(o=>o.account))];return`<h1 class="text-xl font-bold mb-3">Accounts</h1>`+table(['Account','Open deals','Open pipeline','Won'],A.map(a=>{const x=S.opps.filter(o=>o.account==a);return`<tr class="r" onclick="S.q='${E(a).replace(/'/g,'')}';nav('opps')"><td><b>${E(a)}</b></td><td>${x.filter(o=>o.stage<5).length}</td><td>${M(x.filter(o=>o.stage<5).reduce((s,o)=>s+o.amount,0))}</td><td>${M(x.filter(o=>o.stage==5).reduce((s,o)=>s+o.amount,0))}</td></tr>`}).join(''))};
V.contacts=()=>`<h1 class="text-xl font-bold mb-3">Contacts</h1>`+table(['Name','Title','Account','Email'],S.contacts.map(c=>`<tr><td><b>${E(c[0])}</b></td><td>${E(c[1])}</td><td>${E(c[2])}</td><td><a style="color:var(--pr)" href="mailto:${E(c[3])}">${E(c[3])}</a></td></tr>`).join(''));
V.quotes=()=>`<h1 class="text-xl font-bold mb-3">Quotes</h1>`+table(['Quote','Opportunity','Total','Status','Expires'],S.quotes.map(q=>{const o=S.opps.find(x=>x.id==q.opp)||{name:'(deleted)'};return`<tr class="r" onclick="openQuote(${q.opp})"><td><b>${q.no}</b></td><td>${E(o.name)}</td><td>${M(qcalc(q).tot)}</td><td><span class="chip ${q.status=='Approved'?'ok':q.status=='In Review'?'wr':''}">${q.status}</span></td><td>${fd(q.exp)}</td></tr>`}).join(''));
function qcalc(q=S.qd){const sub=q.items.reduce((a,i)=>a+i.p*i.q,0),dis=q.items.reduce((a,i)=>a+i.p*i.q*i.d/100,0);return{sub,dis,tot:sub-dis,pct:sub?dis/sub*100:0}}
function openQuote(id){const o=S.opps.find(x=>x.id==id),ex=S.quotes.find(q=>q.opp==id);S.cur=id;S.qd=ex?clone(ex):{opp:id,no:'Q-'+(1001+S.quotes.length),exp:D(14),status:'Draft',terms:'Net 30',items:clone(o.items)};nav('quote')}
function qsum(){const c=qcalc(),ok=c.pct<=10;return`<div class="flex justify-between py-1"><span class="mut">Subtotal (list)</span>${M(c.sub)}</div><div class="flex justify-between py-1"><span class="mut">Discounts</span>-${M(c.dis)}</div><div class="flex justify-between py-2 border-t text-lg font-bold" style="border-color:var(--bd)"><span>Grand total</span>${M(c.tot)}</div>
<div class="p-3 rounded mt-2 ${ok?'ok':'wr'}"><b>${ok?'Fast-track approval':'Approval required'}</b><br>Blended discount ${c.pct.toFixed(1)}% against your 10% limit. ${ok?'You can send this quote right away.':'A manager must approve before it goes out.'}</div>`}
V.quote=()=>{const q=S.qd,o=cur();if(!q||!o)return V.opps();return`<div class="mut cursor-pointer mb-1" onclick="nav('opp-detail')">‹ Back to ${E(o.name)}</div><h1 class="text-xl font-bold mb-3">Quote ${q.no}</h1>
 <div class="grid lg:grid-cols-3 gap-3"><div class="lg:col-span-2 space-y-3"><div class="card p-4 grid sm:grid-cols-3 gap-3"><label>Quote status<select class="inp" disabled><option>${q.status}</option></select></label><label>Expires<input type="date" class="inp" value="${q.exp}" onchange="S.qd.exp=this.value"></label><label>Payment terms<select class="inp" onchange="S.qd.terms=this.value">${['Net 30','Net 45','Net 60','Due on receipt'].map(t=>`<option ${t==q.terms?'selected':''}>${t}</option>`).join('')}</select></label></div>
 <div class="card"><div class="p-4 pb-2 flex flex-wrap gap-2 items-center"><b class="flex-1">Line items</b><select class="inp" style="width:auto" onchange="qadd(this.value);this.value=''"><option value="">Add product…</option>${CAT.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select></div>
 ${table(['Product','List price','Qty','Discount %','Total',''],q.items.map((i,k)=>`<tr><td>${E(i.n)}<br><small class="mut">${i.c}</small></td><td>${M(i.p)}</td><td><input type="number" min="1" class="inp" style="width:70px" value="${i.q}" oninput="qset(${k},'q',this.value)"></td><td><input type="number" min="0" max="100" class="inp" style="width:70px" value="${i.d}" oninput="qset(${k},'d',this.value)"></td><td id="qr${k}"><b>${M(i.p*i.q*(1-i.d/100))}</b></td><td><span class="ms mut" style="cursor:pointer" title="Remove" onclick="S.qd.items.splice(${k},1);render()">delete</span></td></tr>`).join(''))}</div></div>
 <div class="card p-4 h-fit"><div id="qsum">${qsum()}</div><div class="flex flex-col gap-2 mt-4"><button class="btn btn-p justify-center" onclick="saveQ(1)">Save &amp; generate quote</button><button class="btn justify-center" onclick="saveQ(0)">Save as draft</button><button class="btn justify-center" onclick="nav('opp-detail')">Cancel</button></div></div></div>`}
function qset(k,f,v){const i=S.qd.items[k];i[f]=Math.max(0,+v||0);$('#qr'+k).innerHTML='<b>'+M(i.p*i.q*(1-i.d/100))+'</b>';$('#qsum').innerHTML=qsum()}
function qadd(i){if(i==='')return;const c=CAT[i],x=S.qd.items.find(t=>t.c==c[1]);x?x.q++:S.qd.items.push({n:c[0],c:c[1],p:c[2],q:1,d:0});render()}
function saveQ(gen){const q=S.qd,o=cur(),c=qcalc();if(!q.items.length)return toast('Add at least one product first');q.status=gen?(c.pct>10?'In Review':'Approved'):'Draft';const n=S.quotes.findIndex(x=>x.opp==q.opp);n<0?S.quotes.push(clone(q)):S.quotes[n]=clone(q);o.items=clone(q.items);if(gen)o.amount=Math.round(c.tot);save();
 if(!gen){toast('Draft saved');return nav('opp-detail')}
 $('#modal').innerHTML=`<div class="fixed inset-0 z-40 grid place-items-center p-4" style="background:rgba(0,0,0,.5)"><div class="card p-6 w-full max-w-2xl max-h-full overflow-auto"><div class="flex justify-between"><div><h2 class="text-xl font-bold">Quote ${q.no}</h2><div class="mut">Prepared for ${E(o.account)} · Valid until ${fd(q.exp)} · ${q.terms}</div></div><span class="chip ${c.pct>10?'wr':'ok'}">${q.status}</span></div>
 <div class="my-4">${table(['Item','Qty','Total'],q.items.map(i=>`<tr><td>${E(i.n)}</td><td>${i.q}</td><td>${M(i.p*i.q*(1-i.d/100))}</td></tr>`).join(''))}</div><div class="text-right text-lg font-bold">Total ${M(c.tot)}</div>
 <div class="flex gap-2 justify-end mt-4"><button class="btn" onclick="window.print()">Print or save PDF</button><button class="btn btn-p" onclick="$('#modal').innerHTML='';toast('Quote ${q.no} sent to ${E(o.account)}');nav('opp-detail')">Send to customer</button></div></div></div>`}
function modal(k){const o=cur(),F={opp:['New opportunity',[['name','Opportunity name','text',''],['account','Account','text',''],['amount','Amount ($)','number',''],['close','Close date','date',D(30)],['stage','Stage','select',0,ST]]],lead:['New lead',[['name','Full name','text',''],['company','Company','text',''],['source','Lead source','select','Webinar',['Webinar','Partner Referral','Trade Show','Inbound Web','Outbound']]]],role:['Add contact role',[['name','Contact','select',S.contacts[0][0],S.contacts.map(c=>c[0])],['role','Role','select','Decision Maker',['Decision Maker','Business User','Technical Evaluator','Buyer','Influencer']]]],partner:['Add partner',[['name','Partner name','text',''],['type','Partner type','select','Distributor',['Distributor','Reseller','Referral']]]],edit:['Edit opportunity',[['name','Name','text',o&&o.name],['amount','Amount ($)','number',o&&o.amount],['close','Close date','date',o&&o.close],['next','Next step','text',o&&o.next]]]}[k];
 $('#modal').innerHTML=`<div class="fixed inset-0 z-40 grid place-items-center p-4" style="background:rgba(0,0,0,.5)" onclick="if(event.target==this)this.parentNode.innerHTML=''"><form class="card p-5 w-full max-w-md space-y-3" onsubmit="sub(event,'${k}')"><h2 class="text-lg font-bold">${F[0]}</h2>${F[1].map(f=>`<label class="block">${f[1]}${f[2]=='select'?`<select name="${f[0]}" class="inp">${f[4].map((x,i)=>{const v=f[0]=='stage'?i:x;return`<option value="${v}" ${v==f[3]?'selected':''}>${x}</option>`}).join('')}</select>`:`<input name="${f[0]}" type="${f[2]}" value="${E(f[3])}" class="inp" ${f[0]=='next'?'':'required'}>`}</label>`).join('')}<div class="flex justify-end gap-2"><button type="button" class="btn" onclick="$('#modal').innerHTML=''">Cancel</button><button class="btn btn-p">Save</button></div></form></div>`;$('#modal input').focus()}
function sub(e,k){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));$('#modal').innerHTML='';
 if(k=='opp'){const id=Math.max(0,...S.opps.map(o=>o.id))+1,a=+v.amount;S.opps.push({id,name:v.name,account:v.account,amount:a,stage:+v.stage,close:v.close,owner:'AL',next:'',items:[{n:'Platform licence',c:'GEN-100',p:a,q:1,d:0}]});S.cur=id;save();toast('Opportunity created');nav('opp-detail')}
 if(k=='lead'){S.leads.unshift([v.name,v.company,v.source,'New']);save();toast('Lead added');nav('leads')}
 if(k=='role'){const r=roles(cur());r.push({name:v.name,role:v.role,primary:!r.length});save();toast('Contact role added');render()}
 if(k=='partner'){(cur().partners=cur().partners||[]).push(v);save();toast('Partner added');render()}
 if(k=='edit'){Object.assign(cur(),{name:v.name,amount:+v.amount,close:v.close,next:v.next});save();toast('Changes saved');render()}}
function render(){let v=location.hash.slice(1)||'home';if(!V[v])v='home';const act=v=='opp-detail'||v=='quote'?'opps':v;
 $('#nav').innerHTML=[['home','Home'],['leads','Leads'],['accounts','Accounts'],['contacts','Contacts'],['opps','Opportunities'],['quotes','Quotes']].map(n=>`<a href="#${n[0]}" class="px-3 py-2 font-semibold whitespace-nowrap" style="${act==n[0]?'border-bottom:3px solid var(--pr);color:var(--pr)':'color:var(--mut)'}">${n[1]}</a>`).join('')+`<span class="flex-1"></span><a href="#home" class="px-3 py-2 mut" onclick="if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);location.reload()}">Reset demo</a>`;
 $('#app').innerHTML=V[v]();const ed=$('[data-ed]');ed?ed.focus():scrollTo(0,0)}
addEventListener('hashchange',render);render();
